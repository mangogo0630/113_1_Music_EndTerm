<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Page 03</title>
    <script src="preload-manager.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('images/純題目.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
            position: relative;
        }

        .buttons-section {
            position: absolute;
            left: 45%;
            top: 32%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 28px;
        }

        .confirm-section {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 表情按鈕樣式 */
        .btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            transition: all 0.2s;
            font-size: 0;
        }
        
        /* 確認按鈕樣式 */
        #confirmBtn {
            width: 80px;
            height: 80px;
            background-image: url('images/確定按鈕.png');
        }
        
        #happyBtn, #sadBtn {
            opacity: 0.5;
        }

        #happyBtn.active, #sadBtn.active {
            opacity: 1;
        }

        .btn:hover {
            transform: scale(1.3);
        }

        .btn.active {
            opacity: 1;
        }

        #happyBtn {
            background-image: url('images/笑臉.png');
        }

        #sadBtn {
            background-image: url('images/苦瓜臉.png');
        }
    </style>
</head>
<body>
    <audio id="background-music" loop>
        <source src="music/music.mp3" type="audio/mp3">
    </audio>
    <button id="music-control" style="display: none;"></button>
    <div class="container" id="container">
        <div class="buttons-section">
            <button class="btn" id="happyBtn"></button>
            <button class="btn" id="sadBtn"></button>
        </div>
        <div class="confirm-section">
            <button class="btn" id="confirmBtn"></button>
        </div>
    </div>

    <script>
        // 預加載圖片的功能
function preloadImages() {
    const images = [
        'images/純題目.png',
        'images/happy_bg.jpg',
        'images/sad_bg.jpg',
        'images/笑臉.png',
        'images/苦瓜臉.png',
        'images/確定按鈕.png'
    ];
    
    images.forEach(src => {
        const img = new Image();
        img.src = src;
    });
}

// 當 DOM 載入完成後初始化
window.addEventListener('DOMContentLoaded', () => {
    // 音樂控制初始化
    const audio = document.getElementById("background-music");
    const musicIsPlaying = localStorage.getItem('musicIsPlaying') === 'true';
    const musicTime = localStorage.getItem('musicTime');
    
    if (musicTime) {
        audio.currentTime = parseFloat(musicTime);
    }
    
    if (musicIsPlaying) {
        audio.play().catch(error => {
            console.error("音樂播放失敗:", error);
        });
    }

    // 定期保存音樂時間
    setInterval(() => {
        if (!audio.paused) {
            localStorage.setItem('musicTime', audio.currentTime);
            localStorage.setItem('musicIsPlaying', 'true');
        } else {
            localStorage.setItem('musicIsPlaying', 'false');
        }
    }, 1000);
});

// 離開頁面前保存音樂狀態
window.addEventListener('beforeunload', () => {
    const audio = document.getElementById("background-music");
    localStorage.setItem('musicTime', audio.currentTime);
    localStorage.setItem('musicIsPlaying', !audio.paused);
});

// 頁面載入時執行預加載
window.addEventListener('load', preloadImages);

// 初始化頁面元素和事件
let selectedBackground = 'sad';
const container = document.getElementById('container');
const happyBtn = document.getElementById('happyBtn');
const sadBtn = document.getElementById('sadBtn');
const confirmBtn = document.getElementById('confirmBtn');

// 設置初始狀態
sadBtn.classList.add('active');

// 按鈕事件處理
happyBtn.addEventListener('click', () => {
    container.style.backgroundImage = "url('images/happy_bg.jpg')";
    selectedBackground = 'happy';
    updateButtons('happy');
});

sadBtn.addEventListener('click', () => {
    container.style.backgroundImage = "url('images/sad_bg.jpg')";
    selectedBackground = 'sad';
    updateButtons('sad');
});

function updateButtons(selected) {
    happyBtn.classList.remove('active');
    sadBtn.classList.remove('active');
    if (selected === 'happy') {
        happyBtn.classList.add('active');
    } else {
        sadBtn.classList.add('active');
    }
}

confirmBtn.addEventListener('click', () => {
    let currentScore = parseFloat(localStorage.getItem('testScore')) || 0;
    
    if (selectedBackground === 'happy') {
        currentScore += 2;
    } else {
        currentScore += 1;
    }
    
    localStorage.setItem('testScore', currentScore.toString());
    localStorage.setItem('page3Value', selectedBackground);
    
    window.location.href = 'page_04.html';
});
    </script>
</body>
</html>
