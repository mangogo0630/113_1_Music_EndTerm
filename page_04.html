<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Page 04</title>
    <script src="preload-manager.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .page-container {
            width: 100%;
            height: 100vh;
            background-image: url('images/進度條_bg.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .slider-container {
            width: 20%;
            max-width: 500px;
            position: relative;
            margin-bottom: 40px;
            top: 20px;

        }
        .slider {
            width: 100%;
            height: 2px;
            -webkit-appearance: none;
            appearance: none;
            appearance: none;
            background: #000;
            outline: none;
            position: relative;
            top: 30px;
        }
        /* 修復羽毛圖示 */
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            appearance: none;
            width: 40px;
            height: 60px;
            background-image: url('images/羽毛.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            cursor: pointer;
            border: none;
            margin-top: -30px; /* 調整羽毛的垂直位置 */
        }
        .slider::-moz-range-thumb {
            width: 40px;
            height: 60px;
            background-image: url('images/羽毛.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            cursor: pointer;
            border: none;
            margin-top: -30px;
        }
        .percentage {
            position: absolute;
            top: -20px;
            left: 0;
            transform: translateX(-50%);
            color: #000;
            font-size: 24px;
            font-weight: 900;
            pointer-events: none;
        }
        .next-btn {
            width: 250px;
            background-image: url('images/確定按鈕_2.png');
            height: 75px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            background-color: transparent;
            cursor: pointer;
            transition: transform 0.2s;
            position: absolute;
            bottom: 35%;
            left: 55%;
            transform: translate(calc(-50% + 40px), 0);
        }
        .next-btn:hover {
            transform: translate(calc(-50% + 40px), 0) scale(1.1);
        }
    </style>
</head>
<body>
    <audio id="background-music" loop>
        <source src="music/music.mp3" type="audio/mp3">
    </audio>
    <button id="music-control" style="display: none;"></button>
    <div class="page-container">
        <div class="slider-container">
            <input type="range" min="0" max="100" value="0" class="slider" id="mySlider">
            <div class="percentage" id="percentageValue">0%</div>
        </div>
        <button class="next-btn" id="nextBtn"></button>
    </div>
    <script>
// DOM 元素初始化
const slider = document.getElementById('mySlider');
const percentageValue = document.getElementById('percentageValue');
const nextBtn = document.getElementById('nextBtn');
const audio = document.getElementById('background-music');

// DOM 載入完成後的初始化
window.addEventListener('DOMContentLoaded', () => {
    // 初始化百分比顯示
    updatePercentage(0);

    // 音樂控制初始化
    const musicIsPlaying = localStorage.getItem('musicIsPlaying') === 'true';
    const musicTime = localStorage.getItem('musicTime');
    
    if (musicTime) {
        audio.currentTime = parseFloat(musicTime);
    }
    
    if (musicIsPlaying) {
        audio.play().catch(error => {
            console.error("音樂播放失敗:", error);
        });
    }

    // 定期保存音樂時間
    setInterval(() => {
        if (!audio.paused) {
            localStorage.setItem('musicTime', audio.currentTime);
            localStorage.setItem('musicIsPlaying', 'true');
        } else {
            localStorage.setItem('musicIsPlaying', 'false');
        }
    }, 1000);
});

// 更新百分比顯示
function updatePercentage(value) {
    const percent = value + '%';
    percentageValue.textContent = percent;
    const sliderWidth = slider.offsetWidth;
    const position = (value / 100) * sliderWidth;
    percentageValue.style.left = `${position}px`;
}

// 滑桿輸入事件處理
slider.addEventListener('input', function() {
    const value = this.value;
    updatePercentage(value);
});

slider.addEventListener('change', function() {
    const value = this.value;
    updatePercentage(value);
});

// 下一步按鈕點擊事件
nextBtn.addEventListener('click', function() {
    let currentScore = parseFloat(localStorage.getItem('testScore')) || 0;
    const currentValue = parseInt(slider.value);
    
    // 根據滑桿值計算分數
    if (currentValue <= 40) {
        currentScore += 1;
    } else if (currentValue <= 80) {
        currentScore += 2;
    } else {
        currentScore += 3;
    }
    
    // 儲存分數和滑桿值
    localStorage.setItem('testScore', currentScore.toString());
    localStorage.setItem('page4Value', currentValue);
    
    // 在跳轉前保存音樂狀態
    localStorage.setItem('musicTime', audio.currentTime);
    localStorage.setItem('musicIsPlaying', !audio.paused);
    
    // 跳轉到結果頁
    window.location.href = 'result.html';
});

// 離開頁面前保存音樂狀態
window.addEventListener('beforeunload', () => {
    localStorage.setItem('musicTime', audio.currentTime);
    localStorage.setItem('musicIsPlaying', !audio.paused);
});
    </script>
</body>
</html>
